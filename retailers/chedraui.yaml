rate_limit_rps: 1.0
timeout_s: 20.0

# Excepción aprobada en Fase 2/3 (ver CLAUDE.md): VTEX bloquea el
# User-Agent identificable del proyecto tanto en checkout como en
# catálogo/búsqueda con 429 "rate-limit-reason: bot". Se resuelve con
# HTTP/2 + headers de navegador, aplicado a TODO el tráfico de este
# retailer — no es una excepción por endpoint, es por retailer/plataforma.
overrides:
  requires_browser_like_headers: true
